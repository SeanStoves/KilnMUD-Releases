name: Build & Release

# Builds KilnMUD from its private source on this public repo's free runners, then publishes the
# installers here. The source is pulled onto an ephemeral runner via a read-only deploy key
# (secret SOURCE_DEPLOY_KEY) and never persisted: nothing source-shaped is committed here or uploaded
# as a workflow artifact. Only the finished installers become release assets, and the checkout dies
# with the runner.
#
# Triggered by the private SeanStoves/KilnMUD repo firing a repository_dispatch (build-release) when a
# release is cut there; the tag and release notes ride in the payload. workflow_dispatch is a manual
# fallback for rebuilding a tag by hand.
#
# Two signing steps stay no-ops until their secrets exist (D52): macOS notarization and Windows
# signing. Absent those, the build ships unsigned, which is fine for a daily-driver prerelease.

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from the source repo (e.g. v0.13.0)"
        required: true
      notes:
        description: "Release notes (optional)"
        required: false

permissions:
  contents: write # create the release and upload assets in THIS repo

env:
  SOURCE_REPO: SeanStoves/KilnMUD
  TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

jobs:
  # Create the release up front so the matrix jobs can upload straight to it, no cross-job artifact
  # passing (which would put installers, and the risk of source, into a downloadable workflow artifact).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.client_payload.notes || github.event.inputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > notes.md
          [ -s notes.md ] || printf '%s\n' "$TAG" > notes.md
          # Recreate so a re-run or a recut tag replaces cleanly rather than erroring on an existing tag.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease --notes-file notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      # Ephemeral, read-only checkout of the private source. persist-credentials:false so the deploy
      # key is not left in the runner's git config for later steps to reuse.
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build the app
        run: npm run tauri build

      # Tauri drops bundles under a per-target path. Collect what this OS produced into one flat folder.
      - name: Collect bundles (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) \
            -exec cp {} dist-out/ \;
          ls -la dist-out

      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Get-ChildItem -Recurse src-tauri/target/release/bundle `
            -Include *.exe, *.msi | Copy-Item -Destination dist-out
          Get-ChildItem dist-out

      # Straight to the release, no upload-artifact. Filenames are per-platform so concurrent uploads
      # to the same release do not collide; --clobber makes a re-run replace rather than duplicate.
      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist-out/* --repo "$GITHUB_REPOSITORY" --clobber

  # Feed the dwmud.FYI package pipeline once every platform is up. Done here rather than via the
  # release:published trigger because a release created with GITHUB_TOKEN does not trigger other
  # workflows; publish-to-pkgs.yml stays as a manual re-feed.
  feed-pkgs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch add-package in dwmud-FYI/pkgs
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          echo "publishing $TAG -> dwmud-FYI/pkgs"
          gh workflow run add-package.yml -R dwmud-FYI/pkgs \
            -f source_repo="$GITHUB_REPOSITORY" \
            -f tag="$TAG" \
            -f pkgbase=kilnmud
