name: publish-to-pkgs

# Push a KilnMUD release into the dwmud.FYI package pipeline (apt/rpm/pacman/AUR).
# Requires a repo secret PKGS_DISPATCH_TOKEN — a fine-grained PAT with Actions: read and write on
# dwmud-FYI/pkgs.
#
# Manual only. The automated feed now runs inside build.yml, which fires this same dispatch once all
# platforms are built. A release created there uses GITHUB_TOKEN, which does not trigger a
# release:published workflow, so wiring the auto-feed here would silently never run. This stays as a
# by-hand re-feed of a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish (blank = latest release in this repo)"
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="$TAG_IN"
          [ -n "$TAG" ] || TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$TAG" ] || { echo "no release tag found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch add-package in dwmud-FYI/pkgs
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          echo "publishing ${{ steps.t.outputs.tag }} -> dwmud-FYI/pkgs"
          gh workflow run add-package.yml -R dwmud-FYI/pkgs \
            -f source_repo="$GITHUB_REPOSITORY" \
            -f tag="${{ steps.t.outputs.tag }}" \
            -f pkgbase=kilnmud
